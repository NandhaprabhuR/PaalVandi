name: paalvandi
description: "PaalVandi Delivery Partner App — Operations & Delivery Management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  equatable: ^2.0.8
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/background_images/
    - assets/
    - assets/topbar/
    - assets/animations/
